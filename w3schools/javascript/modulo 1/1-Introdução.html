<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="1-Introdução.css">
    <link rel="shortcut icon" href="/w3schools/img/favicon.ico" type="image/x-icon">
    <title>Introdução ao JavaScript</title>
</head>
<body>
    <h1>Introdução ao JavaScript</h1>
    <p id="d0"></p>

    <button type="button" onclick="document.getElementById('d0').innerHTML = 'Hello JavaScript!'">Click Me!</button>
    <h2>JavaScript pode alterar os valores dos atributos HTML.</h2>
    <button onclick="document.getElementById('mImage').src='/w3schools/img/acesa.png'" >Acender a luz</button>
    <img id="mImage" src="/w3schools/img/apagada.png" alt="luz" style="width: 100px;">
    <button onclick="document.getElementById('mImage').src='/w3schools/img/apagada.png'" >Apague a luz</button>
    <h2 id="d1">O JavaScript pode alterar o estilo de um elemento HTML.</h2>
    <button type="button" onclick="document.getElementById('d1').style.fontSize='35px'">Clique aqui!</button>
    <h2 id="d2">O JavaScript pode ocultar elementos HTML.</h2>
    <button type="button" onclick="document.getElementById('d2').style.display='none'">Apague tudo!</button>
    <h2>JavaScript pode exibir elementos HTML.</h2>
    <p id="d3" style="display:none">Olá JavaScript!</p>
    <button type="button" onclick="document.getElementById('d3').style.display='block'">Clque aqui que vai aparece algo!</button>
    <script src="1-Introdução.js"></script>
</body>
</html>
