<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="img.css">
    <link rel="shortcut icon" href="img/favicon.ico" type="image/x-icon">
    <title>Capítulo 8 Aula 3 – Formatações adicionais em HTML</title>
</head>
<body>
    <h1>Capítulo 8 Aula 3 – Formatações adicionais em HTML</h1>
    <h2>Texto Marcado</h2>
    <p>Usando o texto marcado com a tag <mark>&lt;mark&gt;</mark></p>
    <h2>texto Grande e Pequeno</h2>
    <p><big>Texto Grande aqui</big> e <small>texto Pequeno aqui</small></p>
    <h2>Texto deletado</h2>
    <p><del>Não leia aqui!</del></p>
    <h2>Texto inserido</h2>
    <p><ins>Texto aqui inserido aqui</ins></p>
    <h2>Texto Sobrescrito</h2>
    <p>X<sup>20+3</sup></p>
    <h2>Texto subscrito</h2>
    <p>H<sub>2</sub>O</p>
</body>
</html>
